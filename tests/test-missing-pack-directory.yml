name: Test missing pack_directory error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          packsquash_version: 'v0.4.0'
          options: |
            zip_spec_conformance_level = "pedantic"
            never_store_squash_times = true
        continue-on-error: true

      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when pack_directory is missing, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when pack_directory was not specified"
