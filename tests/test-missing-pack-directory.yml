name: Test missing pack_directory error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run PackSquash action without pack_directory (expect failure)
        id: action
        uses: .
        with:
          # Options without pack_directory should cause the action to fail
          options: |
            zip_spec_conformance_level = "high"
          packsquash_version: "v0.4.1"
          artifact_name: "Optimized pack missing-dir"
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when pack_directory is missing, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when pack_directory was not specified"
