name: Test custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Minecraft resource pack
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-pack"
          cat > "$GITHUB_WORKSPACE/my-pack/pack.mcmeta" << 'EOF'
          {
            "pack": {
              "pack_format": 15,
              "description": "Custom options test pack"
            }
          }
          EOF

      - id: action
        uses: .
        with:
          packsquash_version: 'v0.4.0'
          options: |
            pack_directory = "my-pack"
            zip_spec_conformance_level = "pedantic"
            never_store_squash_times = true
          artifact_name: 'My Custom Pack'
          show_emoji_in_packsquash_logs: 'false'
          enable_color_in_packsquash_logs: 'false'

      - name: Assert action completed successfully with custom options
        run: |
          echo "Action completed with custom artifact name and disabled emoji/color"
          echo "PASS"
