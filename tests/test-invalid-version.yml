name: Test invalid version error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run PackSquash action with invalid version (expect failure)
        id: action
        uses: .
        with:
          options: |
            pack_directory = "tests/fixtures/minimal-pack"
          packsquash_version: "v0.0.0-nonexistent"
          artifact_name: "Optimized pack invalid-version"
        continue-on-error: true

      - name: Assert action failed as expected for invalid version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with an invalid version, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with an invalid/unsupported version"
