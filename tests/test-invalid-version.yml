name: Test invalid PackSquash version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Minecraft resource pack
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-pack"
          cat > "$GITHUB_WORKSPACE/test-pack/pack.mcmeta" << 'EOF'
          {
            "pack": {
              "pack_format": 15,
              "description": "Test pack"
            }
          }
          EOF

      - id: action
        uses: .
        with:
          packsquash_version: 'v99.99.99'
          options: |
            pack_directory = "test-pack"
            zip_spec_conformance_level = "pedantic"
            never_store_squash_times = true
        continue-on-error: true

      - name: Assert action failed with invalid version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid version v99.99.99, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid/unsupported PackSquash version"
